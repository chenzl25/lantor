<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantor</title>
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/startup.css" />
    <script>
      // Match the main window's explicit theme before the first paint.
      try {
        const theme = localStorage.getItem("lantor.themePreference");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <main class="boot" aria-label="Starting Lantor">
      <div class="boot-panel">
        <div class="boot-symbol" aria-hidden="true">
          <img class="boot-logo" src="/lantor-icon.png" width="124" height="124" alt="" />
        </div>
        <div class="boot-copy">
          <strong>Lantor</strong>
          <div class="boot-status" role="status">
            <span>Opening your workspace</span>
            <span class="boot-pips" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
